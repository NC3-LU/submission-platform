name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests (${{ matrix.database }})
    strategy:
      matrix:
        database: [sqlite, mysql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: synthetic-ci-only
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'submission_test' || ':memory:' }}
      APP_ENV: testing
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-only
          MYSQL_DATABASE: submission_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: curl, ctype, dom, fileinfo, gd, iconv, intl, mbstring, pcntl, pdo_mysql, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: composer lint

      - name: Run PHP tests
        run: composer test

      - name: Verify concurrent API mutations
        if: matrix.database == 'mysql'
        run: php tests/Support/api-concurrency.php

  frontend:
    name: Frontend audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

  browser:
    name: Browser workflows and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  containers:
    name: Container (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [runtime-fpm, runtime-apache]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify core limits and rendered container safety settings
        run: python3 tests/Support/test_container_safety.py -v
      - run: >
          docker build --target ${{ matrix.target }}
          --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t submission-ci:test .
      - name: Verify fixed PHP runtime
        run: |
          docker run --rm --network none --entrypoint php submission-ci:test -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'
      - name: Verify server versions are not exposed
        run: |
          docker run --rm --network none --entrypoint php submission-ci:test -r 'exit(ini_get("expose_php") ? 1 : 0);'
          if [ "${{ matrix.target }}" = "runtime-apache" ]; then
            docker run --rm --network none --entrypoint sh submission-ci:test -c 'grep -qs "^ServerTokens Prod$" /etc/apache2/conf-enabled/zz-server-tokens.conf'
          fi
      - name: Verify isolated image and built assets
        run: |
          docker run --rm --entrypoint sh submission-ci:test -c 'test ! -e .env && test ! -e public/hot && test -s public/build/manifest.json && test -z "$(find storage/app -type f -print -quit)"'
          if docker run --rm -e DB_CONNECTION=mysql -e DB_HOST=127.0.0.1 -e DB_DATABASE=unavailable submission-ci:test true; then
            echo 'Startup incorrectly accepted an unavailable database'
            exit 1
          fi
      - name: Save tested image
        if: matrix.target == 'runtime-apache' && github.event_name == 'push'
        run: docker save submission-ci:test | gzip > image.tar.gz
      - name: Keep tested image for publishing
        if: matrix.target == 'runtime-apache' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish image
    if: github.event_name == 'push'
    needs: [php, frontend, browser, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - name: Load tested image
        run: docker load --input image.tar.gz
      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push commit and branch tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in "${GITHUB_REF_NAME}-${GITHUB_SHA}" "${GITHUB_REF_NAME}"; do
            docker tag submission-ci:test "${image}:${tag}"
            docker push "${image}:${tag}"
          done

  deploy-beta:
    name: Deploy beta
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: beta
    permissions: {}
    steps:
      - name: Request deployment
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::notice::Deployment is not configured for this environment."
            exit 0
          fi
          payload=$(printf '{"ref":"%s","head_commit":{"id":"%s","message":"Image %s"},"commits":[]}' \
            "$GITHUB_REF" "$GITHUB_SHA" "${GITHUB_REF_NAME}-${GITHUB_SHA}")
          response=$(mktemp)
          status=$(curl --silent --max-time 60 --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header 'X-GitHub-Event: push' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$DEPLOY_URL") || true
          echo "Deploy request returned HTTP ${status:-none}"
          if [ "$status" != "200" ]; then
            token="${DEPLOY_URL##*/}"
            body=$(head -c 2000 "$response" | tr '\r\n' '  ')
            body="${body//"$token"/***}"
            echo "Response: ${body:0:200}"
            echo "Link: ${#DEPLOY_URL} characters, fingerprint $(printf '%s' "$DEPLOY_URL" | sha256sum | cut -c1-12)"
            exit 1
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
